doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Exclude migrations table from schema introspection so "Schema sync status" does not suggest dropping it
        schema_filter: '/^(?!doctrine_migration_versions).*$/'
    orm:
        enable_native_lazy_objects: true
        entity_managers:
            default:
                auto_mapping: true
                mappings:
                    App:
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
