name: migrations-kit-bundle-demo-symfony-7
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrations-kit-demo-symfony7-php
    working_dir: /app
    restart: unless-stopped
    volumes:
      - .:/app
      # Mount bundle root so the demo uses bundle files from the repo
      - ../..:/var/migrations-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${PORT:-8007}:80"
    networks:
      - migrations-kit-demo-network

  mysql:
    image: mysql:8
    container_name: migrations-kit-demo-symfony7-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    expose:
      - "3306"
    networks:
      - migrations-kit-demo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  composer-cache:
    driver: local

networks:
  migrations-kit-demo-network:
    driver: bridge
