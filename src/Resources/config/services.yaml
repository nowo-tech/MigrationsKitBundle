# Migrations Kit Bundle – create tables via apply() with schema checks.
#
# In migrations: pass introspectSchema() and a definition; apply() returns SQL to create
# only tables that do not exist (checks via $schema->hasTable()).

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Nowo\MigrationsKitBundle\Schema\Definition\SchemaDefinitionParser: ~

  # $connection is set by MigrationsKitExtension to doctrine.dbal.<nowo_migrations_kit.connection>_connection.
  Nowo\MigrationsKitBundle\Migration\CreateTablesService: ~

  Nowo\MigrationsKitBundle\Migration\SchemaChecker: ~
